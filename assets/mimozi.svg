  <text x="78" y="336" fill="#6d28d9" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700">Étape 1 — Identifier le type</text>
  <text x="58" y="350" fill="#374151" font-family="Inter, system-ui, sans-serif" font-size="8">C'est une équation du second degré.</text>
  <text x="58" y="362" fill="#374151" font-family="Inter, system-ui, sans-serif" font-size="8">On utilise la formule : x = (-b ± √Δ) / 2a</text>
  <text x="58" y="378" fill="#6d28d9" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700">Étape 2 — Calculer Δ</text>
  <text x="58" y="390" fill="#374151" font-family="Inter, system-ui, sans-serif" font-size="8">Δ = b² - 4ac = 25 + 24 = 49</text>
  <text x="58" y="402" fill="#374151" font-family="Inter, system-ui, sans-serif" font-size="8">Δ &gt; 0 → deux solutions réelles</text>

