  <rect x="62" y="186" width="168" height="94" rx="8" fill="white" stroke="#d1d5db" stroke-width="1"/>
  <text x="78" y="206" fill="#374151" font-family="Georgia, serif" font-size="10" font-weight="600">Exercice 3 — Algèbre</text>
  <text x="78" y="222" fill="#1f2937" font-family="Georgia, serif" font-size="11">Résoudre : 2x² + 5x - 3 = 0</text>
